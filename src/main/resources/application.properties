spring.application.name=cmms-mantenimiento
# Aplicacion de escritorio: sin servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base de datos SQLite
spring.datasource.url=jdbc:sqlite:mantenimiento.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Registro de actividad
logging.level.root=WARN
logging.level.com.mantenimiento.cmms=INFO
logging.level.org.hibernate.SQL=DEBUG

# Datos de prueba: activos, tecnicos, ordenes y repuestos.
# Es seguro dejarlo activo (no duplica registros); ponlo en false para desactivarlo.
app.seeder.enabled=true

# Datos de la empresa
app.empresa.razon-social=INDUSTRIAS MANTENIMAX S.A.C.
app.empresa.nombre-comercial=ManteniMax
app.empresa.ruc=20601987654
app.empresa.direccion=Av. Industrial 850, Ate - Lima
app.empresa.telefono=(01) 618-3200
